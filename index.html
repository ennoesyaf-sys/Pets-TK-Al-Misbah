<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Pets, My Care — Presentasi Interaktif</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: #20333a; color: #fff; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; min-height: 54px; padding: 10px 18px; display: flex; align-items: center; justify-content: center; gap: 14px; background: #15262c; }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    #count { font-size: 18px; color: #d7eeee; }
    main { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px; }
    #stage { width: auto; height: auto; aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: #FDFBF7; border-radius: 10px; }
    #deck { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: 0; transform-origin: top left; background: #FDFBF7; }
    nav { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
    button, select { min-height: 42px; border: 0; border-radius: 10px; padding: 8px 16px; font-size: 16px; font-weight: 700; cursor: pointer; color: #20333a; background: #fff59d; }
    button.primary { background: #d81b60; color: #fff; }
    button:focus, select:focus { outline: 3px solid #4db6ac; outline-offset: 2px; }
    .hint { margin: 0; font-size: 14px; color: #d7eeee; text-align: center; }
    @media (max-width: 700px) {
      header h1 { font-size: 16px; }
      button, select { min-height: 40px; padding: 7px 10px; font-size: 14px; }
      #stage { width: calc(100vw - 16px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Pets, My Care</h1>
    <span id="count" aria-live="polite">Slide 1 dari 10</span>
  </header>
  <main>
    <section id="stage" aria-label="Area presentasi">
      <iframe id="deck" src="slides/sampul.html" title="Presentasi interaktif My Pets, My Care" allow="fullscreen"></iframe>
    </section>
    <nav aria-label="Navigasi slide">
      <button id="prev" type="button" aria-label="Slide sebelumnya">← Sebelumnya</button>
      <select id="jump" aria-label="Pilih slide"></select>
      <button id="next" class="primary" type="button" aria-label="Slide berikutnya">Berikutnya →</button>
      <button id="fullscreen" type="button">Layar penuh</button>
    </nav>
    <p class="hint">Gunakan tombol atau tombol panah ← → pada keyboard. Di slide kuis, klik pilihan jawaban.</p>
  </main>
  <script>
    const slides = [
      ['sampul', 'Sampul'], ['tujuan', 'Lihat, tunjuk, ucap'], ['hewan_satu', 'Kenali hewan 1'],
      ['hewan_dua', 'Kenali hewan 2'], ['benda', 'Benda perawatan'], ['tempat_kebutuhan', 'Tempat dan kebutuhan'],
      ['rawat', 'Bersikap baik'], ['kuis_klik', 'Kuis klik'], ['ingat_kembali', 'Tebak nama'], ['penutup', 'Penutup']
    ];
    let current = 0;
    const frame = document.getElementById('deck');
    const stage = document.getElementById('stage');
    const jump = document.getElementById('jump');
    slides.forEach(([id, label], index) => {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = `${index + 1}. ${label}`;
      jump.appendChild(option);
    });
    function fitFrame() {
      const width = Math.max(320, Math.min(window.innerWidth - 16, (window.innerHeight - 160) * 16 / 9));
      stage.style.width = `${width}px`;
      stage.style.height = `${width * 9 / 16}px`;
      const scale = width / 1280;
      frame.style.transform = `scale(${scale})`;
    }
    function showSlide(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      frame.src = `slides/${slides[current][0]}.html`;
      jump.value = String(current);
      document.getElementById('count').textContent = `Slide ${current + 1} dari ${slides.length}`;
      document.getElementById('prev').disabled = current === 0;
      document.getElementById('next').disabled = current === slides.length - 1;
    }
    document.getElementById('prev').addEventListener('click', () => showSlide(current - 1));
    document.getElementById('next').addEventListener('click', () => showSlide(current + 1));
    jump.addEventListener('change', () => showSlide(Number(jump.value)));
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try { await stage.requestFullscreen(); } catch (_) { window.alert('Tekan F11 untuk layar penuh.'); }
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') showSlide(current + 1);
      if (event.key === 'ArrowLeft') showSlide(current - 1);
    });
    new ResizeObserver(fitFrame).observe(stage);
    window.addEventListener('resize', fitFrame);
    fitFrame();
    showSlide(0);
  </script>
</body>
</html>
